<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Abfahrten">
<title>Abfahrtsmonitor</title>
<style>
    :root {
    /* Farbschema "4l": Anthrazit, orange Spaltenköpfe, weiße Liniennummern (vom Nutzer gewählt, kein Blau) */
    --bg: #1C1F24;      /* Anthrazit (Hintergrund) */
    --panel: #272B32;   /* Spalten */
    --line: #343A43;    /* Trennlinien */
    --text: #F4F5F7;    /* Schrift */
    --muted: #AEB4BE;   /* Nebentext */
    --accent: #FF8D24;  /* Orange */
    --dark: #1C1F24;    /* dunkle Schrift auf hellen/orangen Flächen */
    --late: #FF6B5E;    /* Verspätung / Ausfall (hell genug für dunklen Grund) */
    --ok: #3CCB75;      /* "jetzt" */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 28px 6px;
  }
  #clock { font-size: 44px; font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  #status { font-size: 16px; color: var(--muted); }
  #status.error { color: var(--late); }
  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
    gap: 16px; padding: 10px 20px 20px;
  }
  section {
    background: var(--panel); border-radius: 14px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  h2 {
    margin: 0; padding: 16px 20px; font-size: 26px; font-weight: 700;
    color: var(--dark); background: var(--accent); border-bottom: 3px solid var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  ul { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  li {
    display: grid; grid-template-columns: 74px 1fr auto;
    gap: 12px; align-items: center;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: 0; }
  .line {
    font-size: 24px; font-weight: 800; background: #FFFFFF; color: var(--dark);
    border-radius: 8px; text-align: center; padding: 6px 0;
  }
  .dir { font-size: 21px; line-height: 1.2; min-width: 0; }
  .dest { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
  .dir small { display: block; font-size: 15px; color: var(--muted); margin-top: 3px; }
  .dir small.late { color: var(--late); }
  .min { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .min span { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .min.now { color: var(--ok); font-size: 26px; }
  li.cancelled .dir, li.cancelled .min { text-decoration: line-through; opacity: .5; }
  .routes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 1fr 1fr; gap: 10px; min-height: 0; }
  .route {
    border-radius: 14px; color: #fff; padding: 8px 12px; min-width: 0; min-height: 0;
    display: grid; grid-template-rows: auto auto 1fr;
    transition: background-color .6s;
  }
  .route-name { font-size: 18px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .route-sub { font-size: 13px; font-weight: 500; line-height: 1.2; opacity: .95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .route-min { align-self: end; justify-self: end; font-size: 28px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1; }
  .route-min span { font-size: 14px; font-weight: 600; margin-left: 2px; }
  .route.na { background: var(--panel); color: var(--muted); }
  .route.na .route-min { font-size: 22px; }
  .route.stand { background: var(--panel); color: var(--muted); display: flex; justify-content: center; align-items: center; text-align: center; font-size: 16px; }
  footer.split { display: grid; grid-template-columns: minmax(0, 1fr); height: max(240px, 44vh); }
  footer.split.nomap { height: clamp(150px, 23vh, 220px); }
  #map .route-layer { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; }
  #map .route {
    position: absolute; padding: 3px 8px 4px; border-radius: 9px; box-shadow: 0 1px 4px rgba(0,0,0,.35);
    display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline; white-space: nowrap;
  }
  #map .route-name { grid-column: 1 / -1; font-size: 13px; line-height: 1.2; }
  #map .route-dir { margin-left: 4px; }
  #map .route-min { font-size: 20px; justify-self: start; }
  #map .route-min span { font-size: 11px; }
  #map .route-sub { font-size: 11px; justify-self: end; }
  #map .route.na .route-min { font-size: 16px; }
  #map .route.stand { display: block; top: 6px; right: 6px; font-size: 12px; padding: 2px 8px; box-shadow: none; }
  #map { position: relative; overflow: hidden; border-radius: 14px; background: #E8E4DC; min-height: 0; }
  #map .map-view { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; opacity: 0; transition: opacity 1s; }
  #map .map-view.aktiv { opacity: 1; }
  #map .map-view.fusswege { background: #F2EFE9; }
  #map .map-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #map .traffic-grob, #map .traffic-fein, #map .traffic-meldungen { position: absolute; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  #map .map-title { position: absolute; left: 6px; top: 6px; z-index: 2; background: var(--accent); color: var(--dark); font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 5px; }
  #map svg.walk { position: absolute; left: 0; top: 0; overflow: visible; }
  #map .stop-sign {
    position: absolute; background: #fff; color: var(--dark); border: 2px solid var(--dark); border-radius: 7px;
    padding: 1px 4px; font-size: 11px; font-weight: 800; white-space: nowrap; line-height: 1.15; text-align: center;
  }
  #map .stop-sign .line { display: inline-block; font-size: 11px; padding: 1px 3px; border-radius: 4px; margin: 1px 1px 0; }
  #map .stop-sign .line { background: var(--dark); color: #fff; }
  #map .stop-sign .walk-min { display: inline-block; background: var(--accent); color: var(--dark); font-size: 11px; padding: 1px 4px; border-radius: 8px; margin: 1px 1px 0 2px; }
  #map .walk-end.oben-rechts { transform: translate(0, -100%); margin-left: 6px; margin-top: -6px; }
  #map .walk-end.unten { transform: translate(-50%, 0); margin-left: 0; margin-top: 8px; }
  #map .walk-end.unten-links { transform: translate(-100%, 0); margin-left: -4px; margin-top: 14px; }
  #map .walk-end {
    position: absolute; transform: translate(-100%, -50%); margin-left: -10px; background: var(--dark); color: #fff;
    font-size: 12px; font-weight: 800; padding: 1px 6px; border-radius: 9px; white-space: nowrap;
  }
  #map img { position: absolute; width: 256px; height: 256px; display: block; user-select: none; }
  #map img.hidden { visibility: hidden; }
  #map .btz-marker {
    position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--dark); box-shadow: 0 0 0 2px #fff;
  }
  #map .btz-label {
    position: absolute; transform: translate(12px, -50%); background: #fff; color: var(--dark);
    font-size: 13px; font-weight: 800; padding: 1px 6px; border-radius: 4px;
  }
  #map .map-note { position: absolute; right: 4px; bottom: 3px; font-size: 10px; color: var(--dark); background: rgba(255,255,255,.8); padding: 1px 5px; border-radius: 3px; }
  #map .map-msg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 18px; background: var(--panel); }
  footer { padding: 0 20px 18px; }
  footer:empty { display: none; }
  .ticker { display: flex; align-items: center; background: var(--panel); border-radius: 14px; overflow: hidden; height: 64px; }
  .ticker-label {
    flex: none; background: var(--accent); color: var(--dark); font-weight: 800; font-size: 18px;
    padding: 0 18px; height: 100%; display: flex; align-items: center; white-space: nowrap;
  }
  .ticker-view { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; padding: 0 16px; }
  .ticker-track { display: inline-block; font-size: 24px; animation: ticker 60s linear infinite; }
  .ticker-item b { color: var(--text); font-weight: 800; }
  .ticker-item + .ticker-item::before { content: "◆"; color: var(--late); margin: 0 28px; }
  .ticker-view .free { font-size: 20px; color: var(--ok); }
  .ticker-view .free.err { color: var(--late); }
  @keyframes ticker { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
  .alerts { margin-top: auto; padding: 10px 14px 14px; display: grid; gap: 8px; }
  .alert {
    background: #33373F; border-left: 5px solid var(--accent);
    border-radius: 6px; padding: 10px 12px; font-size: 16px; line-height: 1.3;
  }
  .alert b { display: block; color: var(--text); font-size: 17px; margin-bottom: 2px; }
  #stops { display: contents; }
  #hbf { background: var(--panel); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #hbf[hidden] { display: none; }
  .hbf-view { flex: 1; min-height: 0; overflow: hidden; }
  .hbf-list { list-style: none; margin: 0; padding: 0; }
  .hbf-list.scrolling { animation: hbfscroll 30s ease-in-out infinite alternate; }
  .hbf-list li.msgli { display: block; }
  @keyframes hbfscroll { 0%, 8% { transform: translateY(0); } 92%, 100% { transform: translateY(var(--dist, 0px)); } }
  main.dense h2 { font-size: 21px; padding: 12px 14px; }
  main.dense li { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 7px; padding: 8px 9px; }
  main.dense .line { font-size: 17px; padding: 5px 0; border-radius: 6px; }
  main.dense .dir { font-size: 17px; line-height: 1.15; }
  main.dense .dir small { font-size: 12.5px; margin-top: 2px; }
  main.dense .min { font-size: 25px; }
  main.dense .min span { font-size: 13px; margin-left: 2px; }
  main.dense .min.now { font-size: 18px; }
  .msg { padding: 24px 20px; color: var(--muted); font-size: 18px; line-height: 1.4; }
  .msg.error { color: var(--late); }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; overflow-y: auto; }
  }
</style>
</head>
<body>
<header>
  <div id="clock">--:--</div>
  <div id="status">Lade Abfahrten …</div>
</header>
<main id="board"><div id="stops"></div><section id="hbf" hidden></section></main>
<footer id="traffic"></footer>

<script>
/* ====== HIER EINTRAGEN ====== */
// Adresse deines Zwischenservers (Cloudflare Worker), z. B. "https://rmv-proxy.DEINNAME.workers.dev"
// Der Zwischenserver hängt den RMV-Zugangsschlüssel selbst an. Der Schlüssel steht dann NICHT mehr in dieser Datei.
const API_PROXY = "https://rmv-proxy.kevin-kuk.workers.dev";
const ACCESS_ID = "";   // nur nötig, wenn API_PROXY leer ist (dann geht es direkt zum RMV)

// Genau drei (oder beliebig viele) Haltestellen: Anzeigename + Haltestellen-ID.
// IDs findest du, indem du diese Seite mit ?suche=Haltestellenname öffnest.
// lat/lon: Lage der Haltestelle, linien: Schild auf der Fußweg-Karte, gehzeit: Minuten zu Fuß vom BTZ-Eingang
const STOPS = [
  { name: "Lagerstraße",             id: "3024970", lat: 49.898842, lon: 8.619073, linien: ["X14", "X15"], gehzeit: 9 },
  { name: "Rudolf-Diesel-Str./BTZ",  id: "3015845", lat: 49.900496, lon: 8.610165, linien: ["WE3", "WE4"], gehzeit: 3 },
  { name: "Robert-Bosch-Straße/B42", id: "3024969", lat: 49.897881, lon: 8.609778, linien: ["WE1", "WE2"], gehzeit: 7 }
];

// Darmstädter Hauptbahnhof: eigene Spalte, die hoch und runter scrollt. Auf null setzen zum Ausblenden.
// products: Zugarten als Summe: ICE = 1, IC/EC = 2, Regionalzüge RE/RB = 4, S-Bahn = 8.
// 12 = nur S-Bahn und Regionalzüge (keine Fernzüge), 15 = alle Züge, 0 oder weglassen = alles (auch Busse und Straßenbahnen).
// max: so viele Abfahrten werden abgerufen, show: so viele werden angezeigt (0 = alle Züge im Zeitfenster DURATION_MIN).
const HBF = { name: "Darmstadt Hbf", id: "3004734", max: 60, products: 12, show: 0 };

const MAX_PER_STOP = 8;      // Abfahrten pro Haltestelle
// RMV erlaubt max. 500 Abrufe pro Tag. Jede Haltestelle = 1 Abruf pro Aktualisierung.
// Beispiel: 3 Haltestellen, alle 45 Sek, 1 Stunde pro Tag = ca. 180–240 Abrufe/Tag.
const REFRESH_SECONDS = 45;       // Abfrage-Intervall der Abfahrten
const MELDUNGEN = false;          // RMV-Störungsmeldungen unten in den Spalten anzeigen (true = an, false = aus)
const MSG_REFRESH_SECONDS = 600;  // Intervall der RMV-Störungsmeldungen
// Betriebszeit pro Wochentag (0 = Sonntag, 1 = Montag, ... 6 = Samstag). Tage ohne Eintrag: Pause.
const ACTIVE_SCHEDULE = {
  1: ["15:15", "16:10"],  // Montag    (Feierabend 16:00)
  2: ["15:15", "16:10"],  // Dienstag
  3: ["15:15", "16:10"],  // Mittwoch
  4: ["15:15", "16:10"],  // Donnerstag
  5: ["13:00", "13:45"]   // Freitag
};
// Testbetrieb: bis zu dieser Uhrzeit läuft der Monitor auch außerhalb der Betriebszeit ("" = aus).
// Format "JJJJ-MM-TTTHH:MM", z. B. "2026-11-20T09:15". Läuft von selbst ab.
const TESTBETRIEB_BIS = "";
const DAILY_LIMIT = 450;          // Sicherheitsgrenze (zählt nur auf diesem Gerät)
const DURATION_MIN = 90;     // Zeitfenster in Minuten
const VERSPAETUNG_ROT_AB = 10;  // Minutenanzeige: pünktlich grün, ab so vielen Minuten Verspätung ganz rot (dazwischen stufenlos)
// Abkürzungen für Fahrtziele, damit sie in die schmalen Spalten passen: [lang, kurz]
const ABKUERZUNGEN = [
  ["Frankfurt (Main) ", "FFM "],
  ["Darmstadt ", "DA "],
  ["Hauptbahnhof", "Hbf"],
  ["Bahnhof", "Bf"]
];
const FETCH_TIMEOUT_SECONDS = 15; // so lange wird auf eine Antwort gewartet, dann gilt sie als fehlgeschlagen
const STALE_SECONDS = 180;        // so lange bleibt nach Fehlern die letzte Liste stehen, danach erscheint der Fehler

// Autobahn-Verkehrsmeldungen (kostenlos, ohne Schlüssel). Leer lassen ([]), um sie auszublenden.
const AUTOBAHNEN = ["A5", "A67"];
// Optional: nur Meldungen zeigen, in denen eines dieser Wörter vorkommt, z. B. ["Frankfurt", "Hanau"].
// Leer lassen ([]), um alle Meldungen der Autobahnen oben zu zeigen.
const AUTOBAHN_FILTER = [
  "Darmstadt", "Darmstädt", "Weiterstadt", "Eberstadt", "Pfungstadt", "Seeheim", "Zwingenberg",
  "Bensheim", "Heppenheim",                                   // Kreis Bergstraße (A5)
  "Lorsch", "Bürstadt", "Lampertheim", "Viernheim",           // Kreis Bergstraße (A67)
  "Büttelborn", "Gerau", "Riedstadt", "Gernsheim", "Rüsselsheim" // Kreis Groß-Gerau (A67)
];
const AUTOBAHN_MAX = 8;      // maximal angezeigte Meldungen im Lauftext
const TICKER_SPEED = 90;     // Lauftext-Tempo in Pixel pro Sekunde (kleiner = langsamer)
const TRAFFIC_REFRESH_SECONDS = 300;

// ---- Unterer Bereich: "fahrzeit" (Fahrzeiten mit Verkehr), "verkehr" (Autobahn-Lauftext) oder "aus" ----
const FOOTER = "fahrzeit";

// Fahrzeiten mit aktuellem Verkehr (TomTom). Braucht den Worker mit Secret TOMTOM_KEY.
// Fehlt der Schlüssel, erscheint unten automatisch der Autobahn-Lauftext.
const ORIGIN = { name: "BTZ Weiterstadt", lat: 49.90026, lon: 8.61292 };   // Eingang Rudolf-Diesel-Straße 30
const DESTINATIONS = [   // höchstens 6; Schilder in der Karte (ohne Karte: Kachelraster mit Feld „Stand")
  { name: "Frankfurt NW-Kreuz", lat: 50.1357, lon: 8.5923 },   // Nordwestkreuz Frankfurt (A5/A66)
  { name: "Heppenheim", lat: 49.6415, lon: 8.6385 },
  { name: "Mannheim",   lat: 49.4875, lon: 8.4660 },
  { name: "Groß-Gerau", lat: 49.9213, lon: 8.4846 },
  { name: "Erbach",     lat: 49.6566, lon: 8.9947 },  // Erbach im Odenwald
  { name: "Dieburg",    lat: 49.8985, lon: 8.8406 }
];
const ROUTE_REFRESH_SECONDS = 300;  // alle 5 Minuten (nur in der Betriebszeit)
// Richtung der Fahrzeiten: bis zu dieser Stunde von den Orten ZUM BTZ (morgens), danach VOM BTZ zu den Orten.
// 0 = immer vom BTZ. Muss zu ZUM_BTZ_BIS im Worker passen (für die Statistik).
const RICHTUNG_ZUM_BTZ_BIS = 12;
const GREEN_UNTIL_MIN = 2;          // bis zu dieser Verzögerung bleibt die Kachel grün
const RED_AT_DELAY_MIN = 15;        // ab dieser Verzögerung ist die Kachel ganz rot
const ROUTE_DAILY_LIMIT = 900;      // Sicherheitsgrenze für TomTom-Abrufe pro Tag (auf diesem Gerät)
const ROUTE_REFRESH_PAUSE_SECONDS = 900;  // außerhalb der Betriebszeit (nur mit KARTE.ganztags): Fahrzeiten alle 15 Minuten

// Verkehrskarte rechts unten (TomTom). Gebiet über die vier Ränder (Breiten-/Längengrad).
// Voreinstellung: Raum Darmstadt, Weiterstadt bis Dieburg, Arheilgen bis Eberstadt.
// zeigen: false blendet die Karte aus. aktualisieren: Sekunden bis zum Nachladen der Verkehrslage.
// ganztags: true = Karte, Verkehr und Fahrzeiten laufen den ganzen Tag (Abfahrten nur in der Betriebszeit).
// wechsel: Sekunden pro Ansicht im Wechsel Verkehr / Fußwege zu den Haltestellen (0 = nur Verkehr).
// Die Fußweg-Ansicht muss im Gebiet liegen, für das der Worker Nahansicht-Bilder freigibt (TILE_NAH in worker.js).
// Verkehrsmeldungen auf der Verkehrskarte (TomTom): Symbole für Unfall, Baustelle, Sperrung, Stau.
// zeigen: false blendet sie aus, deckkraft 0.1–1 macht sie durchsichtiger.
const VERKEHRSMELDUNGEN = { zeigen: true, deckkraft: 1 };
// Dritte Kartenansicht "Verkehr Darmstadt": naher Ausschnitt (vier Ränder), Liniendicke 1–20. zeigen: false = aus.
const KARTE_STADT = { zeigen: true, nord: 49.893, sued: 49.855, west: 8.605, ost: 8.690, dicke: 10 };
// Dünnere Verkehrslinien in der Stadt: Kreis um diesen Punkt (Radius in km) mit Liniendicke "dicke" (1–20).
// Außerhalb gilt die Dicke aus dem Worker (TRAFFIC_THICKNESS). null = überall gleich dick.
const STADT_DUENN = { lat: 49.8728, lon: 8.6512, radiusKm: 3, dicke: 6 };   // Darmstadt Innenstadt
const KARTE = { zeigen: true, nord: 49.93, sued: 49.80, west: 8.57, ost: 8.87, aktualisieren: 300, wechsel: 20, ganztags: true };
/* ============================ */

// Fußwege vom BTZ-Eingang zu den Haltestellen (OpenStreetMap, geprüft 20.11.2026) – nicht ändern.
// Punkte als [Breite, Länge]. Robert-Bosch-Straße: Haltestelle auf der B42-Brücke, je Fahrtrichtung eine Treppe
// (Nordseite: weg von Darmstadt, Südseite hinter der Unterführung: Richtung Darmstadt; vom Nutzer bestätigt).
const FUSSWEGE = {
  "3015845": { weg: [[49.900262,8.612916],[49.900307,8.612555],[49.900374,8.612006],[49.900449,8.611394],[49.900557,8.610521],[49.900543,8.610485],[49.900536,8.610341],[49.900553,8.610179]] },
  "3024969": { weg: [[49.900262,8.612916],[49.900307,8.612555],[49.900374,8.612006],[49.900449,8.611394],[49.900557,8.610521],[49.900543,8.610485],[49.900536,8.610341],[49.899945,8.610137],[49.899887,8.610116],[49.899813,8.610091],[49.899603,8.610018],[49.899453,8.609966],[49.899309,8.609916],[49.898572,8.60966],[49.898471,8.609623],[49.898149,8.609494],[49.898083,8.609467],[49.898,8.60978],[49.898083,8.609467],[49.898068,8.60946],[49.897837,8.609353],[49.897822,8.609347],[49.897786,8.609626]],
    // Weg laut Luftbild des Nutzers: Robert-Bosch-Str. hinunter, am Nordrand der B42 Zipfel nach rechts zur Nord-Treppe,
    // zurück, durch die Unterführung, am Südrand der B42 wieder Zipfel nach rechts zur Süd-Treppe
    treppen: [
      { pos: [49.898, 8.60978], text: "Treppe Richtung Erzhausen / Worfelden", seite: "oben-rechts" },   // Nordseite, Hinweis oberhalb der B42
      { pos: [49.897786, 8.609626], text: "Treppe Richtung DA Schloss", seite: "unten" }                     // Südseite, Hinweis unterhalb der B42
    ] },

const API = API_PROXY ? API_PROXY.replace(/\/$/, "") : "https://www.rmv.de/hapi";
const board = document.getElementById("board");
const stopsEl = document.getElementById("stops");
const hbfEl = document.getElementById("hbf");
const statusEl = document.getElementById("status");
let data = {};   // id -> Liste der Abfahrten
let errors = {}; // id -> Fehlertext
let okAt = {};   // id -> Zeitpunkt des letzten erfolgreichen Abrufs

// Fehler anzeigen, wenn nie geladen wurde oder der letzte Erfolg zu lange her ist
function showError(id) {
  return errors[id] && (!data[id] || Date.now() - (okAt[id] || 0) > STALE_SECONDS * 1000);
}
let lastOk = null;
const LOADED_AT = Date.now();

function pad(n) { return String(n).padStart(2, "0"); }

// Abruf mit Zeitlimit. Fehler tragen .status (HTTP-Status) und .body (Antwort, falls lesbar).
async function fetchJson(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_SECONDS * 1000);
  let res;
  try {
    res = await fetch(url, { signal: ctrl.signal });
  } catch (e) {
    throw new Error(e && e.name === "AbortError" ? "Zeitüberschreitung" : "Keine Verbindung");
  } finally {
    clearTimeout(timer);
  }
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error("HTTP " + res.status);
    err.status = res.status;
    err.body = body;
    throw err;
  }
  if (body === null) throw new Error("Antwort unlesbar");
  return body;
}

function toDate(d, t) {
  if (!d || !t) return null;
  return new Date(d + "T" + t);
}

function parseDeparture(x) {
  const planned = toDate(x.date, x.time);
  const real = toDate(x.rtDate || x.date, x.rtTime) || planned;
  const prod = (x.ProductAtStop || (x.Product && x.Product[0]) || {});
  const cat = String(prod.catOut || prod.catOutS || prod.catCode || "").trim().toUpperCase();
  const line = prod.line || cat || prod.displayNumber || (x.name || "").replace(/^(Bus|Tram|Str|S|U|RE|RB|IC|ICE)\s*/i, "") || "?";
  return {
    cat,
    line: String(line).slice(0, 6),
    dir: ABKUERZUNGEN.reduce((t, [lang, kurz]) => t.split(lang).join(kurz), x.direction || ""),
    planned, real,
    cancelled: x.cancelled === true || x.cancelled === "true"
  };
}

function isActive() {
  const n = new Date();
  if (TESTBETRIEB_BIS && n < new Date(TESTBETRIEB_BIS)) return true;
  const win = ACTIVE_SCHEDULE[n.getDay()];
  if (!win) return false;
  const mins = n.getHours() * 60 + n.getMinutes();
  const [fh, fm] = win[0].split(":").map(Number);
  const [th, tm] = win[1].split(":").map(Number);
  return mins >= fh * 60 + fm && mins < th * 60 + tm;
}

function scheduleText() {
  const names = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const groups = {};
  Object.keys(ACTIVE_SCHEDULE).forEach(d => {
    const k = ACTIVE_SCHEDULE[d].join("–");
    (groups[k] = groups[k] || []).push(names[d]);
  });
  return Object.entries(groups).map(([k, days]) =>
    (days.length > 1 ? `${days[0]}–${days[days.length - 1]}` : days[0]) + " " + k).join(", ") + " Uhr";
}

// Zählt RMV-Abrufe pro Tag auf diesem Gerät und sperrt bei Erreichen des Limits.
function takeCall() {
  const key = "rmvCalls-" + new Date().toLocaleDateString("sv");
  try {
    const n = Number(localStorage.getItem(key) || 0);
    if (n >= DAILY_LIMIT) return false;
    localStorage.setItem(key, String(n + 1));
  } catch (e) {}
  return true;
}

let lastFetch = 0;

function allStops() { return HBF ? [...STOPS, HBF] : STOPS; }

async function loadStop(stop) {
  if (!takeCall()) throw new Error("Tageslimit erreicht");
  const url = `${API}/departureBoard?accessId=${encodeURIComponent(ACCESS_ID)}` +
    `&id=${encodeURIComponent(stop.id)}&format=json&maxJourneys=${stop.max || MAX_PER_STOP}` +
    `&duration=${DURATION_MIN}` + (stop.products ? `&products=${stop.products}` : "");
  const json = await fetchJson(url);
  if (json.errorCode) throw new Error(json.errorText || json.errorCode);
  return (json.Departure || []).map(parseDeparture)
    .filter(d => d.real)
    .sort((a, b) => a.real - b.real);
}

let alertsList = [];   // { head, lead, lines }
let lastMsg = 0;

// Linien, die gerade an den Bushaltestellen angezeigt werden
function shownLines(stop) {
  return [...new Set((data[stop.id] || []).map(d => d.line))];
}

async function loadMessages() {
  const lines = [...new Set(STOPS.flatMap(shownLines))];
  if (!lines.length || !isActive()) return;
  lastMsg = Date.now();
  if (!takeCall()) return;
  try {
    const json = await fetchJson(`${API}/messages?lines=${encodeURIComponent(lines.join(","))}`);
    alertsList = json.messages || [];
  } catch (e) {
    console.warn("Störungsmeldungen nicht verfügbar:", e.message);
  }
}

let refreshing = false;
async function refresh() {
  if (!isActive()) { render(); return; }
  if (refreshing) return;   // vorige Aktualisierung läuft noch
  refreshing = true;
  try { await doRefresh(); } finally { refreshing = false; }
}

async function doRefresh() {
  lastFetch = Date.now();
  const results = await Promise.allSettled(allStops().map(loadStop));
  results.forEach((r, i) => {
    const id = allStops()[i].id;
    if (r.status === "fulfilled") { data[id] = r.value; okAt[id] = Date.now(); delete errors[id]; }
    else { errors[id] = r.reason && r.reason.message ? r.reason.message : "Unbekannter Fehler"; }
  });
  if (results.some(r => r.status === "fulfilled")) lastOk = new Date();
  render();
  // Meldungen erst, wenn die Linien bekannt sind; danach alle MSG_REFRESH_SECONDS
  if (MELDUNGEN && Date.now() - lastMsg > MSG_REFRESH_SECONDS * 1000) loadMessages().then(render);
}

function render() {
  const now = new Date();
  const cols = STOPS.length + (HBF ? 1 : 0);
  board.style.setProperty("--cols", cols);
  board.classList.toggle("dense", cols >= 4);
  statusEl.className = "";
  const failed = Object.keys(errors).length;
  const inactive = !isActive();
  if (inactive) {
    statusEl.textContent = `Pause, aktiv ${scheduleText()}`;
  } else if (failed && !lastOk) {
    statusEl.textContent = "Keine Verbindung zur RMV-Schnittstelle";
    statusEl.className = "error";
  } else if (failed) {
    statusEl.textContent = `${failed} Haltestelle(n) nicht aktuell`;
    statusEl.className = "error";
  } else if (lastOk) {
    statusEl.textContent = `Stand ${pad(lastOk.getHours())}:${pad(lastOk.getMinutes())}:${pad(lastOk.getSeconds())}`;
  }

  stopsEl.innerHTML = "";
  STOPS.forEach(stop => {
    const sec = document.createElement("section");
    const h = document.createElement("h2");
    h.textContent = stop.name;
    sec.appendChild(h);

    const list = (data[stop.id] || []).filter(d => d.real - now > -60000);
    if (!data[stop.id] || showError(stop.id)) {
      const m = document.createElement("div");
      m.className = "msg" + (errors[stop.id] ? " error" : "");
      m.textContent = errors[stop.id]
        ? "Abfahrten konnten nicht geladen werden: " + errors[stop.id]
        : (inactive ? "Außerhalb der Betriebszeit." : "Lade …");
      sec.appendChild(m);
    } else if (!list.length) {
      const m = document.createElement("div");
      m.className = "msg";
      m.textContent = `In den nächsten ${DURATION_MIN} Minuten fährt hier nichts.`;
      sec.appendChild(m);
    } else {
      const ul = document.createElement("ul");
      list.slice(0, MAX_PER_STOP).forEach(d => ul.appendChild(rowFor(d, now)));
      sec.appendChild(ul);
    }
    const here = shownLines(stop);
    const rel = MELDUNGEN ? alertsList.filter(a => (a.lines || []).some(l => here.includes(l))).slice(0, 2) : [];
    if (rel.length) {
      const box = document.createElement("div");
      box.className = "alerts";
      rel.forEach(a => {
        const el = document.createElement("div");
        el.className = "alert";
        const b = document.createElement("b");
        b.textContent = a.head || "Hinweis";
        el.appendChild(b);
        if (a.lead && a.lead.trim() !== (a.head || "").trim()) {
          const t = a.lead.length > 140 ? a.lead.slice(0, 137) + "…" : a.lead;
          el.appendChild(document.createTextNode(t));
        }
        box.appendChild(el);
      });
      sec.appendChild(box);
    }
    stopsEl.appendChild(sec);
  });
  hideCutRows();
  renderHbf(now, inactive);
}

// Farbe der Minutenanzeige: grün (pünktlich) über gelb/orange bis rot (VERSPAETUNG_ROT_AB Minuten und mehr)
function delayColor(delay) {
  const t = Math.min(1, Math.max(0, delay / Math.max(1, VERSPAETUNG_ROT_AB)));
  return `hsl(${Math.round(135 * (1 - t))}, 75%, 55%)`;
}

// Abfahrten, die nicht mehr ganz in ihre Spalte passen, ausblenden (keine angeschnittenen Zeilen)
function hideCutRows() {
  stopsEl.querySelectorAll("section").forEach(sec => {
    const bottom = sec.getBoundingClientRect().bottom;
    let cut = false;
    sec.querySelectorAll("ul li").forEach(li => {
      if (!cut && li.getBoundingClientRect().bottom > bottom + 0.5) cut = true;
      if (cut) li.style.display = "none";
    });
  });
}

function rowFor(d, now) {
  const mins = Math.floor((d.real - now) / 60000);
  const delay = d.planned ? Math.round((d.real - d.planned) / 60000) : 0;
  const li = document.createElement("li");
  if (d.cancelled) li.className = "cancelled";
  const line = document.createElement("div");
  line.className = "line"; line.textContent = d.line;
  const dir = document.createElement("div");
  dir.className = "dir";
  const dest = document.createElement("span");
  dest.className = "dest"; dest.textContent = d.dir;
  dir.appendChild(dest);
  const sub = document.createElement("small");
  const pt = d.planned ? `${pad(d.planned.getHours())}:${pad(d.planned.getMinutes())}` : "";
  if (d.cancelled) { sub.textContent = "Fällt aus"; sub.className = "late"; }
  else if (delay >= 1) { sub.textContent = `${pt} +${delay} min`; sub.className = "late"; }
  else { sub.textContent = `${pt} pünktlich`; }
  dir.appendChild(sub);
  const mn = document.createElement("div");
  mn.className = "min" + (mins <= 0 ? " now" : "");
  if (mins > 0 && !d.cancelled) mn.style.color = delayColor(delay);
  if (mins <= 0) mn.textContent = "jetzt"; else mn.innerHTML = `${mins}<span>min</span>`;
  li.append(line, dir, mn);
  return li;
}

/* Hbf-Spalte: Liste bleibt als Element bestehen, damit das Scrollen nicht neu startet */
let hbfList = null, hbfView = null, hbfDist = -1;
function renderHbf(now, inactive) {
  if (!HBF) { hbfEl.hidden = true; return; }
  if (!hbfList) {
    const h = document.createElement("h2");
    h.textContent = HBF.name;
    hbfView = document.createElement("div");
    hbfView.className = "hbf-view";
    hbfList = document.createElement("ul");
    hbfList.className = "hbf-list";
    hbfView.appendChild(hbfList);
    hbfEl.append(h, hbfView);
  }
  hbfEl.hidden = false;

  const note = text => {
    const li = document.createElement("li");
    li.className = "msgli";
    const m = document.createElement("div");
    m.className = "msg" + (errors[HBF.id] ? " error" : "");
    m.textContent = text;
    li.appendChild(m);
    return li;
  };

  const list = (data[HBF.id] || []).filter(d => d.real - now > -60000);
  let rows;
  if (!data[HBF.id] || showError(HBF.id)) {
    rows = [note(errors[HBF.id] ? "Abfahrten konnten nicht geladen werden: " + errors[HBF.id]
                               : (inactive ? "Außerhalb der Betriebszeit." : "Lade …"))];
  } else if (!list.length) {
    rows = [note(HBF.products ? `In den nächsten ${DURATION_MIN} Minuten fährt hier kein Zug.` : `In den nächsten ${DURATION_MIN} Minuten fährt hier nichts.`)];
  } else {
    rows = (HBF.show ? list.slice(0, HBF.show) : list).map(d => rowFor(d, now));
  }
  hbfList.replaceChildren(...rows);

  const dist = Math.max(0, hbfList.scrollHeight - hbfView.clientHeight);
  if (Math.abs(dist - hbfDist) > 8) {
    hbfDist = dist;
    hbfList.style.setProperty("--dist", "-" + dist + "px");
    hbfList.style.animationDuration = Math.max(10, dist / 25 + 6) + "s";
  }
  hbfList.classList.toggle("scrolling", dist > 4);
}

// Einmal am Tag neu laden (außerhalb der Betriebszeit): räumt auf und holt neue Versionen von GitHub
// Neu geladen wird nur, wenn die Seite gerade erreichbar ist, sonst bliebe Safari auf einer Fehlerseite stehen.
let reloadChecking = false;
async function maybeReload() {
  if (reloadChecking || isActive() || Date.now() - LOADED_AT <= 20 * 3600 * 1000) return;
  reloadChecking = true;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_SECONDS * 1000);
  try {
    const res = await fetch(location.href, { cache: "no-store", signal: ctrl.signal });
    if (res.ok) { location.reload(); return; }
  } catch (e) {
    // offline: später erneut versuchen
  } finally {
    clearTimeout(timer);
  }
  reloadChecking = false;
}

function tickClock() {
  const n = new Date();
  document.getElementById("clock").textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
}

/* ---- Fahrzeiten mit Verkehr ---- */
const routeData = {};   // name -> { min, delay } oder { error }
let routeLoadedAt = null;
let routesEl = null, mapEl = null, routeTimer = null, trafficLayout = null;

function takeRouteCall() {
  const key = "routeCalls-" + new Date().toLocaleDateString("sv");
  try {
    const n = Number(localStorage.getItem(key) || 0);
    if (n >= ROUTE_DAILY_LIMIT) return false;
    localStorage.setItem(key, String(n + 1));
  } catch (e) {}
  return true;
}

function zumBtz() { return new Date().getHours() < RICHTUNG_ZUM_BTZ_BIS; }
let routeDirZum = false;   // Richtung der zuletzt geladenen Fahrzeiten (für Pfeile und Hinweis)

async function loadRoute(dest) {
  if (!takeRouteCall()) throw new Error("Tageslimit erreicht");
  try {
    const btz = `${ORIGIN.lat},${ORIGIN.lon}`, ort = `${dest.lat},${dest.lon}`, zum = zumBtz();
    const name = zum ? dest.name + " → BTZ" : dest.name;
    return await fetchJson(`${API}/route?origin=${zum ? ort : btz}&destination=${zum ? btz : ort}&name=${encodeURIComponent(name)}`);
  } catch (e) {
    const err = new Error(e.body && e.body.error ? e.body.error : e.message);
    err.status = e.status;
    throw err;
  }
}

// Fahrzeiten laufen in der Betriebszeit oder – mit KARTE.ganztags – den ganzen Tag
function routesActive() { return isActive() || !!(KARTE && KARTE.ganztags); }

let lastRouteLoad = 0;
async function loadRoutes() {
  if (!API_PROXY || !routesActive()) { renderRoutes(); return; }
  // außerhalb der Betriebszeit seltener abfragen (TomTom-Kontingent)
  // beim Richtungswechsel (12 Uhr) sofort neu laden, sonst außerhalb der Betriebszeit nur alle 15 Minuten
  const richtungGewechselt = lastRouteLoad && zumBtz() !== routeDirZum;
  if (!richtungGewechselt && !isActive() && lastRouteLoad && Date.now() - lastRouteLoad < ROUTE_REFRESH_PAUSE_SECONDS * 1000 - 5000) return;
  lastRouteLoad = Date.now();
  routeDirZum = zumBtz();
  // nacheinander abfragen: TomTom (kostenlos) erlaubt nur wenige Abfragen pro Sekunde, sonst kommt HTTP 429
  const res = [];
  for (const d of DESTINATIONS) {
    try { res.push({ status: "fulfilled", value: await loadRoute(d) }); }
    catch (e) { res.push({ status: "rejected", reason: e }); }
    await new Promise(r => setTimeout(r, 250));
  }
  // Kein TomTom-Schlüssel im Worker: statt Fehlermeldungen den Autobahn-Lauftext zeigen
  if (res.every(r => r.status === "rejected" && r.reason.status === 503 && r.reason.message === "kein Schlüssel")) {
    startTicker();
    return;
  }
  res.forEach((r, i) => {
    const n = DESTINATIONS[i].name;
    if (r.status === "fulfilled") routeData[n] = r.value;
    else routeData[n] = { error: r.reason && r.reason.message ? r.reason.message : "Fehler" };
  });
  routeLoadedAt = new Date();
  renderRoutes();
}

function routeColor(delay) {
  const t = Math.min(1, Math.max(0, (delay - GREEN_UNTIL_MIN) / Math.max(1, RED_AT_DELAY_MIN - GREEN_UNTIL_MIN)));
  const hue = Math.round(135 * (1 - t));     // 135 = grün, 0 = rot
  return `hsl(${hue}, 65%, 33%)`;
}

function renderRoutes() {
  const layer = mapEl ? mapEl.querySelector(".map-view.verkehr .route-layer") : null;
  const box = layer || routesEl;
  if (!box) return;
  box.innerHTML = "";
  const tiles = [];
  DESTINATIONS.slice(0, 6).forEach(d => {
    const r = routeData[d.name];
    const el = document.createElement("div");
    el.className = "route";
    const nm = document.createElement("div");
    nm.className = "route-name";
    nm.textContent = d.name;
    if (mapEl) { const dr = document.createElement("span"); dr.className = "route-dir"; nm.appendChild(dr); }
    const mn = document.createElement("div");
    mn.className = "route-min";
    const sm = document.createElement("div");
    sm.className = "route-sub";
    if (!r || r.error) {
      el.classList.add("na");
      sm.textContent = !routesActive() ? "Pause" : (r ? r.error : "Lade …");
      mn.textContent = "–";
    } else {
      el.style.backgroundColor = routeColor(r.delay);
      sm.textContent = r.delay >= GREEN_UNTIL_MIN ? `+${r.delay} min Verkehr` : "freie Fahrt";
      mn.innerHTML = `${r.min}<span>min</span>`;
    }
    el.append(nm, sm, mn);
    box.appendChild(el);
    tiles.push({ el, d });
  });
  const st = document.createElement("div");
  st.className = "route stand";
  st.textContent = (routeLoadedAt ? `Stand ${pad(routeLoadedAt.getHours())}:${pad(routeLoadedAt.getMinutes())}` : "Stand –") +
    (routeDirZum ? " · zum BTZ" : " · ab BTZ");
  box.appendChild(st);
  if (layer && trafficLayout) placeCityLabels(layer, trafficLayout, tiles, st);
}

// Richtungspfeil für einen Winkel (Bildschirm: x nach rechts, y nach unten)
function arrowFor(dx, dy) {
  const a = Math.atan2(-dy, dx) * 180 / Math.PI;   // 0 = Osten, 90 = Norden
  const arrows = ["→", "↗", "↑", "↖", "←", "↙", "↓", "↘"];
  return arrows[((Math.round(a / 45) % 8) + 8) % 8];
}

// Setzt die Fahrzeit-Schilder in die Karte: an die Stadt, wenn sie sichtbar ist, sonst an den Rand in ihre Richtung
function placeCityLabels(layer, L, tiles, standEl) {
  const W = layer.clientWidth, H = layer.clientHeight, m = 6;
  const lr = layer.getBoundingClientRect();
  const rel = r => ({ left: r.left - lr.left, top: r.top - lr.top, right: r.right - lr.left, bottom: r.bottom - lr.top });
  const view = layer.parentNode;
  const taken = [rel(standEl.getBoundingClientRect())];
  [".map-note", ".btz-label", ".btz-marker"].forEach(sel => { const e = view.querySelector(sel); if (e) taken.push(rel(e.getBoundingClientRect())); });
  const t = mapEl.querySelector(".map-title");
  if (t) taken.push(rel(t.getBoundingClientRect()));
  const btz = project(L, ORIGIN.lat, ORIGIN.lon);

  tiles.forEach(({ el, d }) => {
    const p = project(L, d.lat, d.lon);
    const inside = p.x > m && p.x < W - m && p.y > m && p.y < H - m;
    const dirEl = el.querySelector(".route-dir");
    // Pfeil in Fahrtrichtung: morgens von der Stadt zum BTZ, nachmittags vom BTZ zur Stadt
    if (dirEl) dirEl.textContent = inside ? "" : (routeDirZum ? arrowFor(btz.x - p.x, btz.y - p.y) : arrowFor(p.x - btz.x, p.y - btz.y));
    const sw = el.offsetWidth, sh = el.offsetHeight;
    const minX = m, maxX = W - m - sw, minY = m, maxY = H - m - sh;
    let x, y, axis;
    if (inside) {
      x = p.x - sw / 2; y = p.y - sh - 4; axis = "x";
    } else {
      // Schnittpunkt der Linie BTZ → Stadt mit dem Rechteck, in dem die Schildmitte liegen darf
      const dx = p.x - btz.x, dy = p.y - btz.y;
      const cx0 = minX + sw / 2, cx1 = maxX + sw / 2, cy0 = minY + sh / 2, cy1 = maxY + sh / 2;
      let tt = Infinity;
      if (dx > 0) tt = Math.min(tt, (cx1 - btz.x) / dx);
      if (dx < 0) tt = Math.min(tt, (cx0 - btz.x) / dx);
      if (dy > 0) tt = Math.min(tt, (cy1 - btz.y) / dy);
      if (dy < 0) tt = Math.min(tt, (cy0 - btz.y) / dy);
      if (!isFinite(tt) || tt < 0) tt = 0;
      const cx = btz.x + dx * tt, cy = btz.y + dy * tt;
      x = cx - sw / 2; y = cy - sh / 2;
      axis = (Math.abs(cy - cy0) < 1 || Math.abs(cy - cy1) < 1) ? "x" : "y";   // oben/unten → seitlich schieben
    }
    // Freien Platz suchen: entlang der Kante schieben, bis nichts mehr überdeckt wird
    let best = null;
    for (let k = 0; k <= 80 && !best; k++) {
      for (const sgn of k ? [1, -1] : [1]) {
        let cx = x, cy = y;
        if (axis === "x") cx += sgn * k * 6; else cy += sgn * k * 6;
        cx = Math.min(maxX, Math.max(minX, cx)); cy = Math.min(maxY, Math.max(minY, cy));
        const r = { left: cx, top: cy, right: cx + sw, bottom: cy + sh };
        if (!taken.some(o => overlapArea(r, o) > 0)) { best = r; break; }
      }
    }
    if (!best) best = { left: Math.min(maxX, Math.max(minX, x)), top: Math.min(maxY, Math.max(minY, y)), right: 0, bottom: 0 };
    best.right = best.left + sw; best.bottom = best.top + sh;
    el.style.left = best.left + "px"; el.style.top = best.top + "px";
    taken.push(best);
  });
}

/* ---- Verkehrskarte (ohne Bibliothek, Kacheln über den Worker) ---- */
function lon2x(lon, z) { return (lon + 180) / 360 * Math.pow(2, z) * 256; }
function lat2y(lat, z) {
  const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z) * 256;
}

// Wählt Zoom und Skalierung so, dass das ganze Gebiet sichtbar ist (Rest der Fläche zeigt die Umgebung)
function mapLayout(k, w, h, zMin, zMax) {
  zMin = zMin || 9; zMax = zMax || 13;
  const bw0 = lon2x(k.ost, 0) - lon2x(k.west, 0);
  const bh0 = lat2y(k.sued, 0) - lat2y(k.nord, 0);
  const z = Math.min(zMax, Math.max(zMin, Math.ceil(Math.log2(Math.min(w / bw0, h / bh0)))));
  const f = Math.pow(2, z);
  const scale = Math.min(w / (bw0 * f), h / (bh0 * f));
  const cx = (lon2x(k.west, z) + lon2x(k.ost, z)) / 2;
  const cy = (lat2y(k.nord, z) + lat2y(k.sued, z)) / 2;
  return { z, scale, originX: cx - w / 2 / scale, originY: cy - h / 2 / scale };
}

function project(L, lat, lon) {
  return { x: (lon2x(lon, L.z) - L.originX) * L.scale, y: (lat2y(lat, L.z) - L.originY) * L.scale };
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// Legt Basiskacheln (und optional Verkehrskacheln) in eine Ansicht
// opts.dicke: feste Liniendicke für alle Verkehrskacheln; opts.stadtMaske: dünne Linien im Kreis STADT_DUENN
function buildTileLayer(view, k, zMin, zMax, withTraffic, opts) {
  opts = opts || {};
  const w = view.clientWidth, h = view.clientHeight;
  const L = mapLayout(k, w, h, zMin, zMax);
  const inner = el("div", "map-inner");
  inner.style.transform = `scale(${L.scale})`;
  const x0 = Math.floor(L.originX / 256), x1 = Math.floor((L.originX + w / L.scale) / 256);
  const y0 = Math.floor(L.originY / 256), y1 = Math.floor((L.originY + h / L.scale) / 256);
  let baseTotal = 0, baseFailed = 0;
  const bases = [], overlays = [];
  // Verkehrsebene in zwei Behältern: grob (überall) und fein (nur Stadtkreis), jeweils mit weicher Maske
  let grob = null, fein = null, stadt = null, meld = null;
  if (withTraffic) {
    const box = cls => {
      const b = el("div", cls);
      b.style.left = (x0 * 256 - L.originX) + "px"; b.style.top = (y0 * 256 - L.originY) + "px";
      b.style.width = (x1 - x0 + 1) * 256 + "px"; b.style.height = (y1 - y0 + 1) * 256 + "px";
      return b;
    };
    grob = box("traffic-grob");
    if (VERKEHRSMELDUNGEN && VERKEHRSMELDUNGEN.zeigen) {
      meld = box("traffic-meldungen");
      meld.style.opacity = String(VERKEHRSMELDUNGEN.deckkraft || 1);
    }
    if (STADT_DUENN && opts.stadtMaske) {
      const mpp = 156543.03392 * Math.cos(STADT_DUENN.lat * Math.PI / 180) / Math.pow(2, L.z);   // Meter pro Pixel
      stadt = {
        x: lon2x(STADT_DUENN.lon, L.z) - x0 * 256, y: lat2y(STADT_DUENN.lat, L.z) - y0 * 256,
        r: STADT_DUENN.radiusKm * 1000 / mpp
      };
      const innen = (stadt.r * 0.85).toFixed(1), aussen = stadt.r.toFixed(1), at = `circle at ${stadt.x.toFixed(1)}px ${stadt.y.toFixed(1)}px`;
      const maske = (e, g) => { e.style.webkitMaskImage = g; e.style.maskImage = g; };
      fein = box("traffic-fein");
      maske(grob, `radial-gradient(${at}, transparent ${innen}px, #000 ${aussen}px)`);
      maske(fein, `radial-gradient(${at}, #000 ${innen}px, transparent ${aussen}px)`);
    }
  }
  for (let x = x0; x <= x1; x++) {
    for (let y = y0; y <= y1; y++) {
      const pos = img => {
        img.style.left = (x * 256 - L.originX) + "px";
        img.style.top = (y * 256 - L.originY) + "px";
        img.alt = "";
        return img;
      };
      const b = pos(el("img", "base"));
      baseTotal++;
      b.onerror = () => {
        b.classList.add("hidden");
        if (++baseFailed === baseTotal && withTraffic) showMapMsg(view, "Karte nicht verfügbar");
      };
      b.src = `${API}/tile/base/${L.z}/${x}/${y}.png`;
      bases.push(b);
      if (withTraffic) {
        const mk = (parent, extra) => {
          const t = el("img", "traffic");
          t.style.left = (x - x0) * 256 + "px"; t.style.top = (y - y0) * 256 + "px"; t.alt = "";
          t.dataset.src = `${API}/tile/traffic/${L.z}/${x}/${y}.png${extra}`;
          t.onerror = () => t.classList.add("hidden");
          t.onload = () => t.classList.remove("hidden");
          parent.appendChild(t);
          overlays.push(t);
        };
        mk(grob, opts.dicke ? "?d=" + opts.dicke : "");
        if (meld) {
          const m = el("img", "traffic incident");
          m.style.left = (x - x0) * 256 + "px"; m.style.top = (y - y0) * 256 + "px"; m.alt = "";
          m.dataset.src = `${API}/tile/incidents/${L.z}/${x}/${y}.png`;
          m.onerror = () => m.classList.add("hidden");
          m.onload = () => m.classList.remove("hidden");
          meld.appendChild(m);
          overlays.push(m);
        }
        if (fein) {
          // nur Kacheln, die den Stadtkreis berühren
          const lx = (x - x0) * 256, ly = (y - y0) * 256;
          const nx = Math.max(lx, Math.min(stadt.x, lx + 256)), ny = Math.max(ly, Math.min(stadt.y, ly + 256));
          if (Math.hypot(nx - stadt.x, ny - stadt.y) <= stadt.r) mk(fein, "?d=" + STADT_DUENN.dicke);
        }
      }
    }
  }
  inner.append(...bases);
  if (grob) inner.appendChild(grob);
  if (fein) inner.appendChild(fein);
  if (meld) inner.appendChild(meld);   // Meldungen über den Verkehrsfarben
  view.appendChild(inner);
  if (withTraffic) trafficImgs = trafficImgs.concat(overlays);
  return { L, inner };
}

function addBtz(view, L) {
  const p = project(L, ORIGIN.lat, ORIGIN.lon);
  const marker = el("div", "btz-marker");
  marker.style.left = p.x + "px"; marker.style.top = p.y + "px";
  const label = el("div", "btz-label", "BTZ");
  label.style.left = p.x + "px"; label.style.top = p.y + "px";
  view.append(marker, label);
  return label;
}

let trafficImgs = [];
let mapView = "verkehr", mapSwitchTimer = null;
const MAP_TITLES = { verkehr: "Verkehr", fusswege: "Fußwege zu den Haltestellen", stadt: "Verkehr Darmstadt" };

function buildMap() {
  if (!mapEl) return;
  mapEl.innerHTML = "";
  trafficImgs = [];
  if (!mapEl.clientWidth || !mapEl.clientHeight) return;

  const title = el("div", "map-title", MAP_TITLES.fusswege);   // längster Text, zum Ausmessen
  mapEl.appendChild(title);
  const v1 = el("div", "map-view verkehr");
  mapEl.insertBefore(v1, title);
  const t1 = buildTileLayer(v1, KARTE, 9, 13, true, { stadtMaske: true });
  trafficLayout = t1.L;
  addBtz(v1, t1.L);
  v1.appendChild(el("div", "map-note", "Verkehr: TomTom"));
  v1.appendChild(el("div", "route-layer"));

  if (KARTE.wechsel > 0) {
    const v2 = el("div", "map-view fusswege");
    mapEl.insertBefore(v2, title);
    buildWalkLayer(v2, title.getBoundingClientRect());
    if (KARTE_STADT && KARTE_STADT.zeigen) {
      const v3 = el("div", "map-view stadt");
      mapEl.insertBefore(v3, title);
      buildTileLayer(v3, KARTE_STADT, 13, 13, true, { dicke: KARTE_STADT.dicke });
      v3.appendChild(el("div", "map-note", "Verkehr: TomTom"));
    }
  }
  if (!mapEl.querySelector(".map-view." + mapView)) mapView = "verkehr";
  showView(mapView);
  refreshTrafficLayer(true);
  renderRoutes();
}

// Gebiet der Fußweg-Karte: alle Wegpunkte, Haltestellen und BTZ, mit Rand
function walkArea() {
  const pts = [[ORIGIN.lat, ORIGIN.lon]];
  STOPS.forEach(s => {
    if (s.lat) pts.push([s.lat, s.lon]);
    const f = FUSSWEGE[s.id];
    if (f) f.weg.forEach(p => pts.push(p));
  });
  const lats = pts.map(p => p[0]), lons = pts.map(p => p[1]);
  const n = Math.max(...lats), so = Math.min(...lats), o = Math.max(...lons), w = Math.min(...lons);
  const mLat = (n - so) * 0.35, mLon = (o - w) * 0.35;
  return { nord: n + mLat, sued: so - mLat, west: w - mLon, ost: o + mLon };
}

function shortName(name) {
  return name.split("/")[0].replace(/-?Stra(ß|ss)e$/, "-Str.").replace(/-Str\.?$/, "-Str.").slice(0, 18);
}

function overlapArea(a, b) {
  return Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left)) *
         Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
}

function buildWalkLayer(view, titleRect) {
  const { L } = buildTileLayer(view, walkArea(), 15, 17, false);
  const W = view.clientWidth, H = view.clientHeight;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "walk");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  view.appendChild(svg);

  const badges = [];
  const pathPts = [];   // Wegpunkte in Pixeln, damit Schilder die Wege nicht verdecken
  STOPS.forEach(s => {
    const f = FUSSWEGE[s.id];
    if (!f || !f.weg.length) return;
    const pts = f.weg.map(p => project(L, p[0], p[1]));
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 6));
      for (let k = 0; k <= n; k++) pathPts.push({ x: a.x + (b.x - a.x) * k / n, y: a.y + (b.y - a.y) * k / n });
    }
    const str = pts.map(p => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    [["#fff", 8], ["#1C1F24", 5]].forEach(([c, wdt]) => {
      const pl = document.createElementNS(NS, "polyline");
      pl.setAttribute("points", str);
      pl.setAttribute("fill", "none");
      pl.setAttribute("stroke", c);
      pl.setAttribute("stroke-width", wdt);
      pl.setAttribute("stroke-linejoin", "round");
      pl.setAttribute("stroke-linecap", "round");
      svg.appendChild(pl);
    });
    if (f.ende) badges.push({ cls: "walk-end", text: f.ende, p: pts[pts.length - 1] });
    (f.treppen || []).forEach(t => badges.push({ cls: "walk-end " + (t.seite || ""), text: t.text, p: project(L, t.pos[0], t.pos[1]) }));
  });

  // Haltestellenpunkte
  STOPS.forEach(s => {
    if (!s.lat) return;
    if (FUSSWEGE[s.id] && FUSSWEGE[s.id].treppen) return;   // Treppen-Hinweise zeigen die Haltestelle, Punkt würde die Zipfel verdecken
    const p = project(L, s.lat, s.lon);
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 7);
    c.setAttribute("fill", "#fff"); c.setAttribute("stroke", "#1C1F24"); c.setAttribute("stroke-width", 3);
    svg.appendChild(c);
  });

  const badgeEls = badges.map(b => {
    const e = el("div", b.cls, b.text);
    e.style.left = b.p.x + "px"; e.style.top = b.p.y + "px";
    view.appendChild(e);
    return e;
  });

  // Schilder so setzen, dass sie BTZ, Punkte, Wege, Plaketten, Titel, Quellenangabe und einander nicht überdecken
  const vr = view.getBoundingClientRect();
  const note = el("div", "map-note", "© OpenStreetMap · Karte: TomTom");
  view.appendChild(note);
  const btzLabel = addBtz(view, L);
  const taken = [btzLabel.getBoundingClientRect(), view.querySelector(".btz-marker").getBoundingClientRect(), note.getBoundingClientRect()]
    .concat([...svg.querySelectorAll("circle")].map(c => c.getBoundingClientRect()))
    .concat(badgeEls.map(e => e.getBoundingClientRect()))
    .concat(titleRect ? [titleRect] : [])
    .concat(pathPts.map(p => ({ left: vr.left + p.x - 3, top: vr.top + p.y - 3, right: vr.left + p.x + 3, bottom: vr.top + p.y + 3 })));
  STOPS.forEach(s => {
    if (!s.lat) return;
    const p = project(L, s.lat, s.lon);
    const sign = el("div", "stop-sign");
    sign.appendChild(el("div", "", shortName(s.name)));
    (s.linien || []).forEach(l => sign.appendChild(el("span", "line", l)));
    if (s.gehzeit) sign.appendChild(el("span", "walk-min", s.gehzeit + " min"));
    view.appendChild(sign);
    const sw = sign.offsetWidth, sh = sign.offsetHeight, gap = 10;
    // Plätze rund um den Punkt, zuerst nah, dann mit größerem Abstand
    const spots = [];
    [gap, gap * 3, gap * 5].forEach(g => {
      spots.push(
        [p.x - sw / 2, p.y - sh - g], [p.x - sw / 2, p.y + g],      // oben, unten
        [p.x - sw - g, p.y - sh / 2], [p.x + g, p.y - sh / 2],      // links, rechts
        [p.x + g, p.y - sh - g], [p.x - sw - g, p.y - sh - g],      // oben rechts, oben links
        [p.x + g, p.y + g], [p.x - sw - g, p.y + g]                 // unten rechts, unten links
      );
    });
    // Platz mit der geringsten Überdeckung; Plätze außerhalb der Karte zählen als stark überdeckt
    let chosen = spots[0], best = Infinity;
    for (const [x, y] of spots) {
      const r = { left: vr.left + x, top: vr.top + y, right: vr.left + x + sw, bottom: vr.top + y + sh };
      const outside = Math.max(0, -x) + Math.max(0, -y) + Math.max(0, x + sw - W) + Math.max(0, y + sh - H);
      const cost = taken.reduce((sum, t) => sum + overlapArea(r, t), 0) + outside * 1000;
      if (cost < best) { best = cost; chosen = [x, y]; }
      if (cost === 0) break;
    }
    sign.style.left = chosen[0] + "px"; sign.style.top = chosen[1] + "px";
    taken.push(sign.getBoundingClientRect());
  });

}

function showView(name) {
  mapView = name;
  if (!mapEl) return;
  mapEl.querySelectorAll(".map-view").forEach(v => v.classList.toggle("aktiv", v.classList.contains(name)));
  const t = mapEl.querySelector(".map-title");
  if (t) t.textContent = MAP_TITLES[name];
}

// Wechselt der Reihe nach durch alle vorhandenen Ansichten: Verkehr → Fußwege → Verkehr Darmstadt
function switchMapView() {
  if (!mapEl) return;
  const order = ["verkehr", "fusswege", "stadt"].filter(n => mapEl.querySelector(".map-view." + n));
  if (order.length < 2) return;
  showView(order[(order.indexOf(mapView) + 1) % order.length]);
  refreshTrafficLayer(false);   // Verkehrslage aktuell halten (gleiche Adresse für 2 min, also kaum Mehrverkehr)
}

function showMapMsg(view, text) {
  if (!view || view.querySelector(".map-msg")) return;
  view.appendChild(el("div", "map-msg", text));
}

function refreshTrafficLayer(force) {
  if (!force && !routesActive()) return;
  const t = Math.floor(Date.now() / 120000);   // gleiche Adresse für 2 Minuten (Speicher im Browser)
  trafficImgs.forEach(img => { img.src = img.dataset.src + (img.dataset.src.indexOf("?") >= 0 ? "&" : "?") + "t=" + t; });
}

function startFahrzeit() {
  trafficEl.innerHTML = "";
  if (KARTE && KARTE.zeigen) {
    // Große Karte über die ganze Breite, Fahrzeiten als Schilder in der Karte
    trafficEl.className = "split";
    mapEl = document.createElement("div");
    mapEl.id = "map";
    trafficEl.appendChild(mapEl);
  } else {
    trafficEl.className = "split nomap";
    routesEl = document.createElement("div");
    routesEl.className = "routes";
    trafficEl.appendChild(routesEl);
  }
  renderRoutes();
  buildMap();
  loadRoutes();
  routeTimer = setInterval(() => { loadRoutes(); refreshTrafficLayer(false); }, ROUTE_REFRESH_SECONDS * 1000);
  if (KARTE && KARTE.aktualisieren && KARTE.aktualisieren !== ROUTE_REFRESH_SECONDS) {
    setInterval(() => refreshTrafficLayer(false), KARTE.aktualisieren * 1000);
  }
  if (mapEl && KARTE.wechsel > 0) mapSwitchTimer = setInterval(switchMapView, KARTE.wechsel * 1000);
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (mapEl) buildMap(); }, 300);
  });
}

let tickerTimer = null;
function startTicker() {
  if (routeTimer) { clearInterval(routeTimer); routeTimer = null; }
  if (mapSwitchTimer) { clearInterval(mapSwitchTimer); mapSwitchTimer = null; }
  routesEl = null; mapEl = null; trafficImgs = []; trafficLayout = null;
  trafficEl.className = "";
  trafficEl.style.gridTemplateColumns = "";
  trafficEl.innerHTML = "";
  if (tickerTimer) return;
  loadTraffic();
  tickerTimer = setInterval(loadTraffic, TRAFFIC_REFRESH_SECONDS * 1000);
}

/* ---- Autobahn-Verkehrsmeldungen ---- */
const AB_API = "https://verkehr.autobahn.de/o/autobahn";
const trafficEl = document.getElementById("traffic");

async function fetchRoad(road, kind) {
  const json = await fetchJson(`${AB_API}/${encodeURIComponent(road)}/services/${kind}`);
  return json[kind] || [];
}

async function loadTraffic() {
  if (!AUTOBAHNEN.length) { trafficEl.innerHTML = ""; return; }
  const jobs = [];
  AUTOBAHNEN.forEach(r => { jobs.push(fetchRoad(r, "warning")); jobs.push(fetchRoad(r, "closure")); });
  const results = await Promise.allSettled(jobs);
  const ok = results.filter(r => r.status === "fulfilled");

  trafficEl.innerHTML = "";
  const bar = document.createElement("div");
  bar.className = "ticker";
  const label = document.createElement("div");
  label.className = "ticker-label";
  label.textContent = "Verkehr " + AUTOBAHNEN.join(" · ");
  const view = document.createElement("div");
  view.className = "ticker-view";
  bar.append(label, view);
  trafficEl.appendChild(bar);

  const note = (text, err) => {
    const f = document.createElement("span");
    f.className = "free" + (err ? " err" : "");
    f.textContent = text;
    view.appendChild(f);
  };

  if (!ok.length) { note("Autobahn-Meldungen konnten nicht geladen werden.", true); return; }

  const words = AUTOBAHN_FILTER.map(w => w.toLowerCase());
  const items = ok.flatMap(r => r.value).map(x => ({
    title: x.title || "",
    sub: x.subtitle || "",
    desc: Array.isArray(x.description) ? x.description.filter(Boolean).join(" ") : (x.description || "")
  })).filter(x => {
    if (!words.length) return true;
    const t = (x.title + " " + x.sub + " " + x.desc).toLowerCase();
    return words.some(w => t.includes(w));
  });

  if (!items.length) { note("Keine Meldungen auf den eingestellten Strecken."); return; }

  const track = document.createElement("div");
  track.className = "ticker-track";
  items.slice(0, AUTOBAHN_MAX).forEach(x => {
    const span = document.createElement("span");
    span.className = "ticker-item";
    const b = document.createElement("b");
    b.textContent = x.title;
    span.appendChild(b);
    const rest = [x.sub, x.desc].filter(Boolean).join(" – ");
    if (rest) span.appendChild(document.createTextNode(" " + (rest.length > 220 ? rest.slice(0, 217) + "…" : rest)));
    track.appendChild(span);
  });
  view.appendChild(track);
  const secs = Math.max(20, (track.scrollWidth + window.innerWidth) / TICKER_SPEED);
  track.style.animationDuration = secs + "s";
}

/* Hilfsmodus: ?suche=Name zeigt Haltestellen-IDs an */
async function stopSearch(term) {
  document.getElementById("clock").textContent = "Haltestellen-Suche";
  statusEl.textContent = `Suche nach „${term}“`;
  try {
    const url = `${API}/location.name?accessId=${encodeURIComponent(ACCESS_ID)}` +
      `&input=${encodeURIComponent(term)}&format=json`;
    const json = await fetchJson(url);
    const items = (json.stopLocationOrCoordLocation || [])
      .map(x => x.StopLocation).filter(Boolean);
    board.style.display = "block";
    board.innerHTML = "<section><h2>Treffer</h2>" +
      (items.length
        ? "<ul>" + items.map(s => `<li style="grid-template-columns:1fr"><div class="dir">${s.name}<small>ID: ${s.extId || s.id}</small></div></li>`).join("") + "</ul>"
        : '<div class="msg">Keine Haltestelle gefunden.</div>') +
      "</section>";
  } catch (e) {
    board.innerHTML = `<section><div class="msg error">Suche fehlgeschlagen: ${e.message}. Prüfe den Zugangsschlüssel.</div></section>`;
  }
}

/* Bildschirm anlassen, falls der Browser es erlaubt */
async function keepAwake() {
  try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { keepAwake(); if (Date.now() - lastFetch > REFRESH_SECONDS * 1000) refresh(); } });

const q = new URLSearchParams(location.search).get("suche");
if (q) {
  stopSearch(q);
} else {
  tickClock();
  setInterval(() => {
    tickClock(); maybeReload();
    if (FOOTER === "fahrzeit" && routeTimer && lastRouteLoad && zumBtz() !== routeDirZum) loadRoutes();   // Richtungswechsel um 12 Uhr sofort
    if (lastOk || Object.keys(data).length) render();
  }, 15000);
  render();
  refresh();
  setInterval(refresh, REFRESH_SECONDS * 1000);
  if (FOOTER === "fahrzeit") startFahrzeit();
  else if (FOOTER === "verkehr") startTicker();
  keepAwake();
}
</script>
</body>
